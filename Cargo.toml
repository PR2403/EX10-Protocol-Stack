[package]
name = "uhf-ex10"
version = "0.1.0"
edition = "2024"
description = "EX10 系列 UHF RFID 读卡器(E310/E510/E710/E910)的 no_std Rust 协议栈：全指令覆盖、流式解码器、私有 CRC-16，含 std 串口传输层与 CLI"
license = "MIT"
repository = "https://github.com/PR2403/EX10-Protocol-Stack"
readme = "README.md"
keywords = ["rfid", "uhf", "rfid-reader", "no_std", "serial"]
categories = ["hardware-support", "no-std", "embedded"]
exclude = [
    "doc/*",
    "plan/*",
    "size-bench/*",
    "examples/*",
    "AGENTS.md",
    ".gitignore",
]

[lib]
name = "uhf_ex10"
path = "src/lib.rs"

[[bin]]
name = "uhf-demo"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["dep:serialport", "dep:log", "dep:env_logger", "dep:clap"]

[dependencies]
heapless = { version = "0.8", default-features = false }

# 仅 std
serialport = { version = "4", optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
clap = { version = "4.6", optional = true, features = ["derive", "env"] }
